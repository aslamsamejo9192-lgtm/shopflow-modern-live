<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>ShopFlow Android App Modern</title>
<style>
  :root{
    --navy:#0c2b28; --navy2:#0f766e; --indigo:#0d9488; --indigo-dark:#0f766e;
    --indigo-soft:#e6f4f1; --emerald:#0d9488; --emerald-soft:#e6f4f1;
    --amber:#b45309; --amber-soft:#fef3c7; --red:#dc2626; --red-soft:#fef2f2;
    --bg:#f4f6f5; --card:#ffffff; --ink:#14201e; --ink2:#64748b; --line:#e6ebe9;
    --field:#f8faf9; --shadow:0 1px 2px rgba(12,43,40,.04),0 10px 30px -12px rgba(12,43,40,.12);
    --nav-bg:#ffffff; --teal:#0d9488;
  }
  [data-theme="dark"]{
    --navy:#e6f4f1; --navy2:#2dd4bf; --indigo:#2dd4bf; --indigo-soft:#12312d;
    --emerald:#2dd4bf; --emerald-soft:#12312d; --amber:#fbbf24; --amber-soft:#33270a;
    --red:#f87171; --red-soft:#3a1518;
    --bg:#0a1210; --card:#131e1b; --ink:#ecf3f1; --ink2:#94a8a3; --line:#22332f;
    --field:#0e1815; --nav-bg:#131e1b; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:#dce8e4; color:var(--ink);
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
  }
  [data-theme="dark"] body{background:#040807;}
  button,[role="button"],select,input,textarea{font-family:inherit;}
  button,select,input:not([type="checkbox"]){min-height:44px;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

  .phone{
    width:100%; max-width:430px; min-height:100vh; background:var(--bg);
    display:flex; flex-direction:column; position:relative; overflow-x:hidden;
  }
  @media (min-width:560px){
    body{padding:24px 0 32px;}
    .phone{min-height:calc(100vh - 56px); border-radius:38px;
      border:10px solid #0c1a17; box-shadow:0 30px 70px rgba(4,20,17,.5); overflow:hidden;}
  }
  .scroll{flex:1; overflow-y:auto; padding:0 16px 132px;}
  .scroll.no-nav{padding-bottom:30px;}

  .preview-strip{
    background:#fff7e0; color:#92600a; border-bottom:1px solid #f3e3ae;
    font-size:11.5px; font-weight:700; text-align:center; padding:7px 10px; letter-spacing:.06em; text-transform:uppercase;
  }
  [data-theme="dark"] .preview-strip{background:#2a2108; color:#fbbf24; border-color:#3a2f10;}
  .topbar{
    background:linear-gradient(135deg,#0a2724 0%,#0c3a35 55%,#0f766e 135%); color:#fff;
    padding:20px 18px 18px; display:flex; align-items:center; gap:12px;
    border-radius:0 0 26px 26px; box-shadow:0 14px 30px -14px rgba(12,43,40,.55);
  }
  .topbar h1{font-size:20px; margin:0; font-weight:800; line-height:1.2; letter-spacing:-.01em; overflow-wrap:break-word;}
  .topbar .sub{font-size:12.5px; opacity:.85; margin-top:3px; font-weight:500;}
  .topbar .back{
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22); color:#fff; width:40px; height:40px;
    border-radius:999px; font-size:19px; flex:none; display:grid; place-items:center;
  }
  .avatar{
    width:44px;height:44px;border-radius:999px;flex:none;display:grid;place-items:center;
    background:#fff; color:#0f766e; font-weight:800; font-size:17px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);
  }
  .bell{margin-left:auto; position:relative; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22); color:#fff;
    width:40px;height:40px;border-radius:999px;font-size:17px; flex:none;}
  .bell .dot{position:absolute; top:8px; right:9px; width:8px;height:8px;border-radius:50%; background:#fbbf24; border:2px solid #0c3a35;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:16px; margin-top:14px;}
  .card h3{margin:0 0 12px; font-size:15.5px; font-weight:800; letter-spacing:-.01em;}
  .row{display:flex; align-items:center; gap:10px;}
  .grow{flex:1; min-width:0;}
  .muted{color:var(--ink2); font-size:12.5px;}
  .small{font-size:12px;}
  .bold{font-weight:700;}
  .right{margin-left:auto;}
  .price{font-weight:800; color:var(--ink); white-space:nowrap; letter-spacing:-.01em;}
  .pos{color:#0d9488;} .neg{color:var(--red);}
  [data-theme="dark"] .pos{color:#2dd4bf;}
  .btn{
    border:0; border-radius:14px; padding:11px 18px; font-size:15px; font-weight:700;
    background:var(--teal); color:#fff; min-height:48px; letter-spacing:-.01em;
    box-shadow:0 10px 20px -10px rgba(13,148,136,.7);
  }
  .btn.block{width:100%;}
  .btn.emerald{background:#0f766e;}
  .btn.ghost{background:var(--card); color:var(--ink); border:1.5px solid var(--line); box-shadow:none;}
  .btn.danger{background:var(--red-soft); color:var(--red); box-shadow:none;}
  .btn.sm{min-height:38px; padding:7px 13px; font-size:13px; border-radius:11px; box-shadow:none;}
  .btn:disabled{opacity:.5;}
  .chip{
    border:1.5px solid var(--line); background:var(--card); color:var(--ink2);
    border-radius:999px; padding:8px 15px; font-size:13px; font-weight:700; min-height:38px; white-space:nowrap;
  }
  .chip.on{background:#0c2b28; color:#fff; border-color:#0c2b28;}
  [data-theme="dark"] .chip.on{background:#2dd4bf; color:#06231f; border-color:#2dd4bf;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:14px 16px 2px; margin:0 -16px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .badge{display:inline-block; font-size:11px; font-weight:800; padding:4px 9px; border-radius:999px; letter-spacing:.01em;}
  .b-green{background:var(--emerald-soft); color:#0f766e;}
  [data-theme="dark"] .b-green{color:#2dd4bf;}
  .b-red{background:var(--red-soft); color:var(--red);}
  .b-amber{background:var(--amber-soft); color:var(--amber);}
  .b-indigo{background:var(--indigo-soft); color:#0f766e;}
  [data-theme="dark"] .b-indigo{color:#2dd4bf;}
  .b-gray{background:var(--field); color:var(--ink2);}
  label{display:block; font-size:13.5px; font-weight:700; margin:18px 0 7px; line-height:1.35; color:var(--ink);}
  label:first-child{margin-top:0;}
  .grid2:not(:first-child) > div > label:first-child{margin-top:18px;}
  input,select,textarea{
    width:100%; border:1.5px solid var(--line); background:var(--field); color:var(--ink);
    border-radius:14px; padding:11px 13px; font-size:15px; min-width:0;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--teal); background:var(--card); outline:none; box-shadow:0 0 0 4px rgba(13,148,136,.14);}
  textarea{resize:vertical; min-height:64px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .grid2 > div{min-width:0; display:flex; flex-direction:column;}
  .grid2 > div > input,.grid2 > div > select{margin-top:auto;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:15px;}
  .stat .lbl{font-size:11.5px; color:var(--ink2); font-weight:800; text-transform:uppercase; letter-spacing:.06em;}
  .stat .val{font-size:21px; font-weight:800; margin-top:5px; color:var(--ink); letter-spacing:-.02em;}
  .stat .val.green{color:#0d9488;} .stat .val.red{color:var(--red);} .stat .val.amber{color:var(--amber);}
  [data-theme="dark"] .stat .val.green{color:#2dd4bf;}
  .qa-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px;}
  .qa{background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow);
    padding:12px 4px 10px; text-align:center; font-size:11.5px; font-weight:700; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; gap:7px; min-height:70px;}
  .qa .ic{width:38px;height:38px;border-radius:13px; display:grid; place-items:center; font-size:17px; background:var(--indigo-soft);}
  .qa.new{border:1.5px dashed #0d9488; background:var(--emerald-soft);}
  .qa.new .ic{background:#cdeee7;}
  [data-theme="dark"] .qa.new .ic{background:#123f31;}
  .list-item{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);}
  .list-item:last-child{border-bottom:0;}
  .list-item .btn,.list-item .qty{flex:none;}
  .list-item .bold{overflow-wrap:break-word;}
  .thumb{width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center;font-size:20px;background:var(--indigo-soft);}
  .thumb.green{background:var(--emerald-soft);} .thumb.amber{background:var(--amber-soft);} .thumb.red{background:var(--red-soft);}
  .menu-item{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0;
    border-bottom:1px solid var(--line); padding:14px 2px; font-size:15px; font-weight:600; color:var(--ink); min-height:52px;}
  .menu-item:last-child{border-bottom:0;}
  .menu-item .ic{width:38px;height:38px;border-radius:13px;background:var(--field);display:grid;place-items:center;font-size:17px;flex:none;}
  .menu-item .arr{margin-left:auto; color:var(--ink2); font-weight:700;}
  .menu-item.danger{color:var(--red);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--ink2); font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:8px 4px; border-bottom:1px solid var(--line); font-weight:800;}
  td{padding:9px 4px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:break-word;}
  tr:last-child td{border-bottom:0;}
  td.num,th.num{text-align:right;}
  .bars{display:flex; align-items:flex-end; gap:6px; height:112px; padding-top:8px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; min-width:0;}
  .bar{width:100%; max-width:30px; border-radius:8px 8px 4px 4px; background:#99d5cd; min-height:3px;}
  .bar.today{background:#0d9488;}
  .bar-col .d{font-size:10.5px; color:var(--ink2); font-weight:700;}
  .bar-col .v{font-size:10px; color:var(--ink2); white-space:nowrap;}
  .empty{text-align:center; padding:28px 10px; color:var(--ink2); font-size:13.5px;}
  .empty .big{font-size:32px; margin-bottom:6px;}
  .search{position:relative; margin-top:14px;}
  .search input{padding-left:40px; border-radius:999px;}
  .search .si{position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:15px; color:var(--ink2);}
  .qty{display:flex; align-items:center; gap:4px;}
  .qty button{width:34px;height:34px;min-height:34px; border-radius:999px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); font-size:16px; font-weight:800; padding:0;}
  .qty .n{min-width:24px; text-align:center; font-weight:800; font-size:14px;}
  .tot-row{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:5px 0; color:var(--ink2);}
  .tot-row span{min-width:0;}
  .tot-row span:last-child{text-align:right; overflow-wrap:break-word;}
  .tot-row.grand{font-size:17px; font-weight:800; color:var(--ink); border-top:1px dashed var(--line); margin-top:7px; padding-top:11px;}
  .seg{display:flex; gap:4px; background:var(--field); border:1px solid var(--line); border-radius:999px; padding:4px;}
  .seg button{flex:1; border:0; background:transparent; border-radius:999px; font-weight:700; font-size:13.5px; color:var(--ink2); min-height:40px; white-space:nowrap; padding:0 8px;}
  .seg button.on{background:#0c2b28; color:#fff; box-shadow:0 6px 14px -6px rgba(12,43,40,.5);}
  [data-theme="dark"] .seg button.on{background:#2dd4bf; color:#06231f;}
  .switch{position:relative; width:50px; height:30px; flex:none; display:inline-block; margin:0;}
  .switch input{-webkit-appearance:none; appearance:none; width:50px; height:30px; border-radius:999px; background:var(--line); position:relative; cursor:pointer; transition:.2s; margin:0; padding:0; border:0; min-height:30px; display:block;}
  .switch input::after{content:""; position:absolute; width:24px;height:24px;border-radius:50%; background:#fff; top:3px; left:3px; transition:.2s; box-shadow:0 1px 4px rgba(0,0,0,.25);}
  .switch input:checked{background:#0d9488;}
  .switch input:checked::after{left:23px;}
  .switch .tr{display:none;}

  .bottomnav{
    position:absolute; left:12px; right:12px; bottom:calc(10px + env(safe-area-inset-bottom)); background:var(--nav-bg);
    border:1px solid var(--line); border-radius:24px; display:flex; padding:6px;
    box-shadow:0 18px 36px -12px rgba(12,43,40,.28); z-index:30;
  }
  .bottomnav button{
    flex:1; background:none; border:0; color:var(--ink2); font-size:11px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 5px; min-height:54px; border-radius:18px;
  }
  .bottomnav button .ic{font-size:20px; line-height:1;}
  .bottomnav button.on{color:#0f766e; background:var(--indigo-soft);}
  [data-theme="dark"] .bottomnav button.on{color:#2dd4bf;}
  .fab{
    position:absolute; right:16px; bottom:104px; z-index:25; width:56px; height:56px; border-radius:999px;
    background:#0d9488; color:#fff; border:0; font-size:27px; box-shadow:0 14px 28px -8px rgba(13,148,136,.65);
  }

  .auth-hero{background:linear-gradient(160deg,#0a2724 0%,#0c3a35 58%,#0f766e 140%); color:#fff; padding:44px 22px 42px; text-align:center; border-radius:0 0 30px 30px;}
  .auth-hero .logo{width:68px;height:68px;border-radius:22px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:32px;margin:0 auto 14px; border:1px solid rgba(255,255,255,.28);}
  .auth-hero h1{margin:0; font-size:30px; font-weight:800; letter-spacing:-.02em;}
  .auth-hero p{margin:7px 0 0; font-size:13.5px; opacity:.88; line-height:1.55; font-weight:500;}
  .auth-card{margin:-20px 16px 0; background:var(--card); border:1px solid var(--line); border-radius:24px; box-shadow:0 20px 40px -18px rgba(12,43,40,.3); padding:20px 18px;}
  .link{background:none; border:0; color:#0f766e; font-weight:700; font-size:13.5px; padding:6px 2px; min-height:38px;}
  [data-theme="dark"] .link{color:#2dd4bf;}
  .google-btn{width:100%; background:var(--card); border:1.5px solid var(--line); color:var(--ink); border-radius:14px; font-weight:700; font-size:14.5px; min-height:48px;}
  .divider{display:flex; align-items:center; gap:10px; color:var(--ink2); font-size:12px; margin:15px 0; font-weight:600;}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line);}

  .receipt{background:#fff; color:#1c2434; border-radius:10px; padding:18px 16px; font-family:"Courier New",monospace; font-size:13px; box-shadow:var(--shadow); margin-top:14px;}
  [data-theme="dark"] .receipt{background:#f7f8fa;}
  .receipt h4{margin:0; text-align:center; font-size:16px;}
  .receipt .c{text-align:center;}
  .receipt hr{border:0; border-top:1px dashed #9aa5b5; margin:9px 0;}
  .receipt table{font-size:12.5px;} .receipt td,.receipt th{border:0; padding:3px 2px; color:#1c2434;}

  .plan{border:1.5px solid var(--line); border-radius:20px; padding:16px; margin-top:12px; background:var(--card);}
  .plan.cur{border-color:#0d9488; background:var(--emerald-soft);}
  .plan .pname{font-size:16px; font-weight:800;}
  .plan .pprice{font-size:23px; font-weight:800; color:var(--ink); letter-spacing:-.02em;}
  .plan ul{margin:9px 0 0; padding-left:18px; font-size:13px; color:var(--ink2); line-height:1.7;}

  .toast{
    position:absolute; left:50%; transform:translateX(-50%); bottom:108px; z-index:60;
    background:#0c2b28; color:#fff; padding:12px 17px; border-radius:14px; font-size:13.5px; font-weight:700;
    box-shadow:0 14px 30px rgba(0,0,0,.3); max-width:88%; text-align:center; display:none;
  }
  .toast.show{display:block;}
  .modal-wrap{position:absolute; inset:0; background:rgba(4,18,15,.6); z-index:50; display:none; align-items:flex-end; justify-content:center;}
  .modal-wrap.show{display:flex;}
  .modal{background:var(--card); width:100%; max-height:88%; overflow-y:auto; border-radius:26px 26px 0 0; padding:22px 18px calc(26px + env(safe-area-inset-bottom));}
  .modal h3{margin:0 0 6px; font-size:17px; font-weight:800;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>

/* ================= HELPERS ================= */
function $(id){ return document.getElementById(id); }
function fmt(n){ return 'Rs ' + Math.round(n).toLocaleString('en-PK'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function prod(id){ for(var i=0;i<S.products.length;i++) if(S.products[i].id===id) return S.products[i]; return null; }
function custByName(n){ for(var i=0;i<S.customers.length;i++) if(S.customers[i].name===n) return S.customers[i]; return S.customers[0]; }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); },2400); }
function openModal(html){ $('modalBox').innerHTML=html; $('modalWrap').classList.add('show'); }
function closeModal(){ $('modalWrap').classList.remove('show'); }
function go(screen){ S.screen=screen; S.notifOpen=false; render(); var sc=document.querySelector('.scroll'); if(sc) sc.scrollTop=0; window.scrollTo(0,0); }
function salesIn(offFrom,offTo){ return S.sales.filter(function(s){ return s.off>=offFrom && s.off<=offTo; }); }
function sumSales(list){ return list.reduce(function(a,s){ return a+s.total; },0); }
function sumProfit(list){ return list.reduce(function(a,s){ return a+(s.total-s.cost); },0); }
function stockValue(){ return S.products.reduce(function(a,p){ return a+p.stock*p.buy; },0); }
function lowStock(){ return S.products.filter(function(p){ return p.stock>0 && p.stock<=p.min; }); }
function outStock(){ return S.products.filter(function(p){ return p.stock===0; }); }
function custDues(){ return S.customers.reduce(function(a,c){ return a+c.due; },0); }
function supPayables(){ return S.suppliers.reduce(function(a,s){ return a+s.payable; },0); }
function stockBadge(p){
  if(p.stock===0) return '<span class="badge b-red">Out of stock</span>';
  if(p.stock<=p.min) return '<span class="badge b-amber">Low · '+p.stock+' left</span>';
  return '<span class="badge b-green">'+p.stock+' in stock</span>';
}
function notifications(){
  var n=[];
  lowStock().forEach(function(p){ n.push({ic:'⚠️',txt:p.name+' is low on stock ('+p.stock+' left)',cls:'amber'}); });
  outStock().forEach(function(p){ n.push({ic:'⛔',txt:p.name+' is out of stock',cls:'red'}); });
  var soon=new Date(Date.now()+7*DAY);
  S.products.forEach(function(p){ if(p.expiry && new Date(p.expiry)<=soon && p.stock>0) n.push({ic:'⏰',txt:p.name+' expires on '+p.expiry,cls:'amber'}); });
  n.push({ic:'💳',txt:'Your '+S.plan+' plan renews soon — check Subscription',cls:''});
  return n;
}

var NAV=[['dashboard','🏠','Home'],['pos','🧾','POS'],['products','📦','Products'],['reports','📊','Reports'],['profile','👤','Profile']];
function topbar(title,sub,back){
  var h='<div class="topbar">';
  if(back) h+='<button class="back" onclick="go(\''+back+'\')" aria-label="Back">‹</button>';
  h+='<div class="grow"><h1>'+title+'</h1>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
  h+='<button class="bell" onclick="toggleNotif()" aria-label="Notifications">🔔'+(notifications().length?'<span class="dot"></span>':'')+'</button></div><!--NSLOT-->';
  return h;
}
function shell(inner,activeNav,fab){
  var h='<div class="preview-strip">PREVIEW — DEMO DATA · Nothing is saved</div>';
  h+=inner;
  var panel='';
  if(S.notifOpen){
    var ns=notifications();
    panel='<div class="card" style="margin:12px 16px 0;"><h3>🔔 Notifications</h3>';
    if(!ns.length) panel+='<div class="empty">No notifications</div>';
    ns.forEach(function(n){ panel+='<div class="list-item"><div class="thumb '+n.cls+'">'+n.ic+'</div><div class="grow" style="font-size:13.5px;">'+esc(n.txt)+'</div></div>'; });
    panel+='</div>';
  }
  h=h.replace('<!--NSLOT-->', panel);
  var nav='';
  if(activeNav){
    nav='<nav class="bottomnav">'+NAV.map(function(n){
      return '<button class="'+(activeNav===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')"><span class="ic">'+n[1]+'</span>'+n[2]+'</button>';
    }).join('')+'</nav>';
  }
  return '<div class="scroll'+(activeNav?'':' no-nav')+'" style="padding-left:0;padding-right:0;"><div style="padding:0 0;">'+h+'</div></div>'+(fab||'')+nav;
}

/* ================= POS ================= */
function cartTotals(){
  var sub=0,cost=0;
  S.cart.forEach(function(ci){ var p=prod(ci.id); if(!p)return; sub+=p.sell*ci.qty*(1-(ci.disc||0)/100); cost+=p.buy*ci.qty; });
  var afterDisc=sub*(1-(S.invDisc||0)/100);
  var tax=afterDisc*(S.shop.tax/100);
  return {sub:sub, discAmt:sub-afterDisc, tax:tax, grand:afterDisc+tax, cost:cost};
}
function vPOS(){
  var cats=['All'].concat(S.categories.map(function(c){return c.name;}));
  var list=S.products.filter(function(p){
    return p.status==='Active' && (S.posCat==='All'||p.cat===S.posCat) &&
      (p.name.toLowerCase().indexOf(S.posSearch.toLowerCase())>=0 || p.barcode.indexOf(S.posSearch)>=0 || p.sku.toLowerCase().indexOf(S.posSearch.toLowerCase())>=0);
  });
  var h=topbar('Point of Sale','Tap a product to add it to the bill');

  inner+='<div class="chips">'+cats.map(function(c){ return '<button class="chip'+(S.posCat===c?' on':'')+'" onclick="S.posCat=\''+c+'\';render()">'+esc(c)+'</button>'; }).join('')+'</div>';
  inner+='<div id="posList">'+posListHTML(list)+'</div>';
  inner+=cartHTML();
  return shell(h+pad(inner),'pos');
}
function posListHTML(list){

      +'<button class="btn sm emerald" '+(p.stock===0?'disabled':'')+' onclick="addToCart('+p.id+')">+ Add</button></div>';

function refreshPOSList(){

      (p.name.toLowerCase().indexOf(S.posSearch.toLowerCase())>=0 || p.barcode.indexOf(S.posSearch)>=0);

}

    h+='<div class="tot-row"><span>Change to return</span><span class="bold pos" id="changeOut">—</span></div>';
  }
  h+='<button class="btn emerald block" style="margin-top:12px;" onclick="completeSale()">✅ Complete Sale</button></div>';
  return h;
}
function updChange(grand){ var v=parseFloat($('cashAmt').value)||0; $('changeOut').textContent = v>=grand? fmt(v-grand) : (v>0?'Need '+fmt(grand-v)+' more':'—'); }
function addToCart(id){ var p=prod(id); var ex=null;
  S.cart.forEach(function(ci){ if(ci.id===id) ex=ci; });
  if(ex){ if(ex.qty>=p.stock){ toast('Only '+p.stock+' in stock'); return; } ex.qty++; }
  else S.cart.push({id:id,qty:1,disc:0});
  render();
}
function chgQty(i,d){ var ci=S.cart[i]; var p=prod(ci.id); ci.qty+=d;
  if(ci.qty<=0) S.cart.splice(i,1);
  else if(p && ci.qty>p.stock){ ci.qty=p.stock; toast('Only '+p.stock+' in stock'); }
  render();
}
function removeCart(i){ S.cart.splice(i,1); render(); }
function setItemDisc(i,v){ S.cart[i].disc=Math.min(100,Math.max(0,parseFloat(v)||0)); render(); }
function completeSale(){
  if(!S.cart.length){ toast('Cart is empty'); return; }
  var t=cartTotals();
  if((S.payType==='Partial'||S.payType==='Credit') && S.posCustomer==='Walk-in'){ toast('Select a named customer for partial / credit sales'); return; }
  var paid=t.grand;
  if(S.payType==='Partial'){ paid=parseFloat(($('paidAmt')||{}).value)||0; if(paid<=0||paid>=t.grand){ toast('Enter a partial amount between 1 and the total'); return; } }
  if(S.payType==='Credit') paid=0;
  var id=S.nextIds.sale++;
  var items=S.cart.map(function(ci){ var p=prod(ci.id);
    var prev=p.stock; p.stock-=ci.qty;
    S.movements.unshift({id:S.nextIds.mov++, ts:Date.now(), prod:p.name, prev:prev, now:p.stock, chg:-ci.qty, reason:'Sale #'+id, user:'Aslam'});
    return {name:p.name, qty:ci.qty, price:p.sell, cost:p.buy, disc:ci.disc||0};
  });
  var due=t.grand-paid;
  if(due>0){ var c=custByName(S.posCustomer); c.due+=due; S.ledger.unshift({custId:c.id, ts:Date.now(), desc:'Sale #'+id+' ('+S.payType+')', amt:due, type:'due'}); }
  var sale={id:id, ts:Date.now(), off:0, items:items, total:t.grand, cost:t.cost, cust:S.posCustomer, pay:S.payType, disc:t.discAmt, tax:t.tax, paid:paid};
  S.sales.unshift(sale);
  S.cart=[]; S.invDisc=0; S.paidAmt='';
  S.lastSale=sale; go('receipt');
}

function saveProduct(){
  var name=$('pf_name').value.trim(); if(!name){ toast('Product name is required'); return; }
  var sku=$('pf_sku').value.trim();
  var dup=S.products.some(function(p){ return p.id!==S.editProdId && sku && p.sku===sku; });
  if(dup){ toast('This SKU already exists in your shop'); return; }
  var data={name:name, sku:sku||('SKU-'+S.nextIds.prod), barcode:$('pf_bar').value.trim(), cat:$('pf_cat').value, unit:$('pf_unit').value,
    brand:$('pf_brand').value.trim(), buy:parseFloat($('pf_buy').value)||0, sell:parseFloat($('pf_sell').value)||0,
    min:parseInt($('pf_min').value)||0, expiry:$('pf_exp').value, status:$('pf_status').value};
  if(S.editProdId){
    var p=prod(S.editProdId); var newStock=parseInt($('pf_stock').value)||0;
    if(newStock!==p.stock){ S.movements.unshift({id:S.nextIds.mov++, ts:Date.now(), prod:p.name, prev:p.stock, now:newStock, chg:newStock-p.stock, reason:'Manual edit', user:'Aslam'}); }
    for(var k in data) p[k]=data[k]; p.stock=newStock;
    toast('Product updated');
  } else {
    data.id=S.nextIds.prod++; data.stock=parseInt($('pf_stock').value)||0; S.products.push(data);
    if(data.stock>0) S.movements.unshift({id:S.nextIds.mov++, ts:Date.now(), prod:data.name, prev:0, now:data.stock, chg:data.stock, reason:'Opening stock', user:'Aslam'});
    toast('Product added');
  }
  go('products');
}

function completePurchase(total){
  if(!S.purLines.length){ toast('Add at least one item'); return; }
  var paid=Math.min(total, parseFloat(($('pur_paid')||{}).value)||0);
  var id=S.nextIds.pur++;
  var items=S.purLines.map(function(l){ var p=prod(l.prodId);
    var prev=p.stock; p.stock+=l.qty; p.buy=l.price;
    S.movements.unshift({id:S.nextIds.mov++, ts:Date.now(), prod:p.name, prev:prev, now:p.stock, chg:l.qty, reason:'Purchase #'+id, user:'Aslam'});
    return {name:p.name, qty:l.qty, price:l.price};
  });
  var payable=total-paid;
  S.suppliers.forEach(function(s){ if(s.name===S.purSupplier) s.payable+=payable; });
  S.purchases.unshift({id:id, ts:Date.now(), supplier:S.purSupplier, items:items, total:total, paid:paid, payable:payable});
  toast('Purchase completed — stock updated'); go('purchases');
}
