<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<title>ShopFlow Android App Modern</title>
<style>
  :root{
    --navy:#0c2b28; --navy2:#0f766e; --indigo:#0d9488; --indigo-dark:#0f766e;
    --indigo-soft:#e6f4f1; --emerald:#0d9488; --emerald-soft:#e6f4f1;
    --amber:#b45309; --amber-soft:#fef3c7; --red:#dc2626; --red-soft:#fef2f2;
    --bg:#f4f6f5; --card:#ffffff; --ink:#14201e; --ink2:#64748b; --line:#e6ebe9;
    --field:#f8faf9; --shadow:0 1px 2px rgba(12,43,40,.04),0 10px 30px -12px rgba(12,43,40,.12);
    --nav-bg:#ffffff; --teal:#0d9488;
  }
  [data-theme="dark"]{
    --navy:#e6f4f1; --navy2:#2dd4bf; --indigo:#2dd4bf; --indigo-soft:#12312d;
    --emerald:#2dd4bf; --emerald-soft:#12312d; --amber:#fbbf24; --amber-soft:#33270a;
    --red:#f87171; --red-soft:#3a1518;
    --bg:#0a1210; --card:#131e1b; --ink:#ecf3f1; --ink2:#94a8a3; --line:#22332f;
    --field:#0e1815; --nav-bg:#131e1b; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:#dce8e4; color:var(--ink);
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
  }
  [data-theme="dark"] body{background:#040807;}
  button,[role="button"],select,input,textarea{font-family:inherit;}
  button,select,input:not([type="checkbox"]){min-height:44px;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

  .phone{
    width:100%; max-width:430px; min-height:100vh; background:var(--bg);
    display:flex; flex-direction:column; position:relative; overflow-x:hidden;
  }
  @media (min-width:560px){
    body{padding:24px 0 32px;}
    .phone{min-height:calc(100vh - 56px); border-radius:38px;
      border:10px solid #0c1a17; box-shadow:0 30px 70px rgba(4,20,17,.5); overflow:hidden;}
  }
  .scroll{flex:1; min-height:0; overflow-y:auto; padding:0 16px 132px;}
  .scroll.no-nav{padding-bottom:30px;}

  .topbar{
    background:linear-gradient(135deg,#0a2724 0%,#0c3a35 55%,#0f766e 135%); color:#fff;
    padding:20px 18px 18px; display:flex; align-items:center; gap:12px;
    border-radius:0 0 26px 26px; box-shadow:0 14px 30px -14px rgba(12,43,40,.55);
  }
  .topbar h1{font-size:20px; margin:0; font-weight:800; line-height:1.2; letter-spacing:-.01em; overflow-wrap:break-word;}
  .topbar .sub{font-size:12.5px; opacity:.85; margin-top:3px; font-weight:500;}
  .topbar .back{
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22); color:#fff; width:40px; height:40px;
    border-radius:999px; font-size:19px; flex:none; display:grid; place-items:center;
  }
  .avatar{
    width:44px;height:44px;border-radius:999px;flex:none;display:grid;place-items:center;
    background:#fff; color:#0f766e; font-weight:800; font-size:17px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);
  }
  .bell{margin-left:auto; position:relative; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22); color:#fff;
    width:40px;height:40px;border-radius:999px;font-size:17px; flex:none;}
  .bell .dot{position:absolute; top:8px; right:9px; width:8px;height:8px;border-radius:50%; background:#fbbf24; border:2px solid #0c3a35;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:16px; margin-top:14px;}
  .card h3{margin:0 0 12px; font-size:15.5px; font-weight:800; letter-spacing:-.01em;}
  .row{display:flex; align-items:center; gap:10px;}
  .grow{flex:1; min-width:0;}
  .muted{color:var(--ink2); font-size:12.5px;}
  .small{font-size:12px;}
  .bold{font-weight:700;}
  .right{margin-left:auto;}
  .price{font-weight:800; color:var(--ink); white-space:nowrap; letter-spacing:-.01em;}
  .pos{color:#0d9488;} .neg{color:var(--red);}
  [data-theme="dark"] .pos{color:#2dd4bf;}
  .btn{
    border:0; border-radius:14px; padding:11px 18px; font-size:15px; font-weight:700;
    background:var(--teal); color:#fff; min-height:48px; letter-spacing:-.01em;
    box-shadow:0 10px 20px -10px rgba(13,148,136,.7);
  }
  .btn.block{width:100%;}
  .btn.emerald{background:#0f766e;}
  .btn.ghost{background:var(--card); color:var(--ink); border:1.5px solid var(--line); box-shadow:none;}
  .btn.danger{background:var(--red-soft); color:var(--red); box-shadow:none;}
  .btn.sm{min-height:38px; padding:7px 13px; font-size:13px; border-radius:11px; box-shadow:none;}
  .btn:disabled{opacity:.5;}
  button:active{transform:scale(.97);}
  .busy{opacity:.6 !important; pointer-events:none;}
  #print-area{display:none;}
  @media print{
    body{display:block; background:#fff; padding:0;}
    #phone{display:none !important;}
    #print-area{display:block !important; color:#111; font-family:"Courier New",monospace; font-size:13px; line-height:1.5; padding:10px;}
    #print-area h4{margin:0 0 4px; text-align:center; font-size:16px;}
    #print-area .c{text-align:center;}
    #print-area hr{border:0; border-top:1px dashed #9aa5b5; margin:9px 0;}
    #print-area table{width:100%; font-size:12.5px; border-collapse:collapse;}
    #print-area td,#print-area th{padding:3px 2px; text-align:left; border:0;}
    #print-area td.num,#print-area th.num{text-align:right;}
  }
  .chip{
    border:1.5px solid var(--line); background:var(--card); color:var(--ink2);
    border-radius:999px; padding:8px 15px; font-size:13px; font-weight:700; min-height:38px; white-space:nowrap;
  }
  .chip.on{background:#0c2b28; color:#fff; border-color:#0c2b28;}
  [data-theme="dark"] .chip.on{background:#2dd4bf; color:#06231f; border-color:#2dd4bf;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:14px 16px 2px; margin:0 -16px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .badge{display:inline-block; font-size:11px; font-weight:800; padding:4px 9px; border-radius:999px; letter-spacing:.01em;}
  .b-green{background:var(--emerald-soft); color:#0f766e;}
  [data-theme="dark"] .b-green{color:#2dd4bf;}
  .b-red{background:var(--red-soft); color:var(--red);}
  .b-amber{background:var(--amber-soft); color:var(--amber);}
  .b-indigo{background:var(--indigo-soft); color:#0f766e;}
  [data-theme="dark"] .b-indigo{color:#2dd4bf;}
  .b-gray{background:var(--field); color:var(--ink2);}
  label{display:block; font-size:13.5px; font-weight:700; margin:18px 0 7px; line-height:1.35; color:var(--ink);}
  label:first-child{margin-top:0;}
  .grid2:not(:first-child) > div > label:first-child{margin-top:18px;}
  input,select,textarea{
    width:100%; border:1.5px solid var(--line); background:var(--field); color:var(--ink);
    border-radius:14px; padding:11px 13px; font-size:15px; min-width:0;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--teal); background:var(--card); outline:none; box-shadow:0 0 0 4px rgba(13,148,136,.14);}
  textarea{resize:vertical; min-height:64px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .grid2 > div{min-width:0; display:flex; flex-direction:column;}
  .grid2 > div > input,.grid2 > div > select{margin-top:auto;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:15px;}
  .stat .lbl{font-size:11.5px; color:var(--ink2); font-weight:800; text-transform:uppercase; letter-spacing:.06em;}
  .stat .val{font-size:21px; font-weight:800; margin-top:5px; color:var(--ink); letter-spacing:-.02em;}
  .stat .val.green{color:#0d9488;} .stat .val.red{color:var(--red);} .stat .val.amber{color:var(--amber);}
  [data-theme="dark"] .stat .val.green{color:#2dd4bf;}
  .qa-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px;}
  .qa{background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow);
    padding:12px 4px 10px; text-align:center; font-size:11.5px; font-weight:700; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; gap:7px; min-height:70px;}
  .qa .ic{width:38px;height:38px;border-radius:13px; display:grid; place-items:center; font-size:17px; background:var(--indigo-soft);}
  .qa.new{border:1.5px dashed #0d9488; background:var(--emerald-soft);}
  .qa.new .ic{background:#cdeee7;}
  [data-theme="dark"] .qa.new .ic{background:#123f31;}
  .list-item{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);}
  .list-item:last-child{border-bottom:0;}
  .list-item .btn,.list-item .qty{flex:none;}
  .list-item .bold{overflow-wrap:break-word;}
  .thumb{width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center;font-size:20px;background:var(--indigo-soft);}
  .thumb.green{background:var(--emerald-soft);} .thumb.amber{background:var(--amber-soft);} .thumb.red{background:var(--red-soft);}
  .menu-item{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0;
    border-bottom:1px solid var(--line); padding:14px 2px; font-size:15px; font-weight:600; color:var(--ink); min-height:52px;}
  .menu-item:last-child{border-bottom:0;}
  .menu-item .ic{width:38px;height:38px;border-radius:13px;background:var(--field);display:grid;place-items:center;font-size:17px;flex:none;}
  .menu-item .arr{margin-left:auto; color:var(--ink2); font-weight:700;}
  .menu-item.danger{color:var(--red);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--ink2); font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:8px 4px; border-bottom:1px solid var(--line); font-weight:800;}
  td{padding:9px 4px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:break-word;}
  tr:last-child td{border-bottom:0;}
  td.num,th.num{text-align:right;}
  .bars{display:flex; align-items:flex-end; gap:6px; height:112px; padding-top:8px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; min-width:0;}
  .bar{width:100%; max-width:30px; border-radius:8px 8px 4px 4px; background:#99d5cd; min-height:3px;}
  .bar.today{background:#0d9488;}
  .bar-col .d{font-size:10.5px; color:var(--ink2); font-weight:700;}
  .bar-col .v{font-size:10px; color:var(--ink2); white-space:nowrap;}
  .empty{text-align:center; padding:28px 10px; color:var(--ink2); font-size:13.5px;}
  .empty .big{font-size:32px; margin-bottom:6px;}
  .search{position:relative; margin-top:14px;}
  .search input{padding-left:40px; border-radius:999px;}
  .search .si{position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:15px; color:var(--ink2);}
  .qty{display:flex; align-items:center; gap:4px;}
  .qty button{width:34px;height:34px;min-height:34px; border-radius:999px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); font-size:16px; font-weight:800; padding:0;}
  .qty .n{min-width:24px; text-align:center; font-weight:800; font-size:14px;}
  .tot-row{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:5px 0; color:var(--ink2);}
  .tot-row span{min-width:0;}
  .tot-row span:last-child{text-align:right; overflow-wrap:break-word;}
  .tot-row.grand{font-size:17px; font-weight:800; color:var(--ink); border-top:1px dashed var(--line); margin-top:7px; padding-top:11px;}
  .seg{display:flex; gap:4px; background:var(--field); border:1px solid var(--line); border-radius:999px; padding:4px;}
  .seg button{flex:1; border:0; background:transparent; border-radius:999px; font-weight:700; font-size:13.5px; color:var(--ink2); min-height:40px; white-space:nowrap; padding:0 8px;}
  .seg button.on{background:#0c2b28; color:#fff; box-shadow:0 6px 14px -6px rgba(12,43,40,.5);}
  [data-theme="dark"] .seg button.on{background:#2dd4bf; color:#06231f;}
  .switch{position:relative; width:50px; height:30px; flex:none; display:inline-block; margin:0;}
  .switch input{-webkit-appearance:none; appearance:none; width:50px; height:30px; border-radius:999px; background:var(--line); position:relative; cursor:pointer; transition:.2s; margin:0; padding:0; border:0; min-height:30px; display:block;}
  .switch input::after{content:""; position:absolute; width:24px;height:24px;border-radius:50%; background:#fff; top:3px; left:3px; transition:.2s; box-shadow:0 1px 4px rgba(0,0,0,.25);}
  .switch input:checked{background:#0d9488;}
  .switch input:checked::after{left:23px;}
  .switch .tr{display:none;}

  .bottomnav{
    position:fixed; left:50%; transform:translateX(-50%); width:min(406px,calc(100vw - 24px)); bottom:calc(10px + env(safe-area-inset-bottom)); background:var(--nav-bg);
    border:1px solid var(--line); border-radius:24px; display:flex; padding:6px;
    box-shadow:0 18px 36px -12px rgba(12,43,40,.28); z-index:30;
  }
  .bottomnav button{
    flex:1; background:none; border:0; color:var(--ink2); font-size:11px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 5px; min-height:54px; border-radius:18px;
  }
  .bottomnav button .ic{font-size:20px; line-height:1;}
  .bottomnav button.on{color:#0f766e; background:var(--indigo-soft);}
  [data-theme="dark"] .bottomnav button.on{color:#2dd4bf;}
  .fab{
    position:absolute; right:16px; bottom:104px; z-index:25; width:56px; height:56px; border-radius:999px;
    background:#0d9488; color:#fff; border:0; font-size:27px; box-shadow:0 14px 28px -8px rgba(13,148,136,.65);
  }

  .auth-hero{background:linear-gradient(160deg,#0a2724 0%,#0c3a35 58%,#0f766e 140%); color:#fff; padding:44px 22px 42px; text-align:center; border-radius:0 0 30px 30px;}
  .auth-hero .logo{width:68px;height:68px;border-radius:22px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:32px;margin:0 auto 14px; border:1px solid rgba(255,255,255,.28);}
  .auth-hero h1{margin:0; font-size:30px; font-weight:800; letter-spacing:-.02em;}
  .auth-hero p{margin:7px 0 0; font-size:13.5px; opacity:.88; line-height:1.55; font-weight:500;}
  .auth-card{margin:-20px 16px 0; background:var(--card); border:1px solid var(--line); border-radius:24px; box-shadow:0 20px 40px -18px rgba(12,43,40,.3); padding:20px 18px;}
  .ob-hero{position:relative;}
  .ob-back{position:absolute; top:18px; left:16px; width:40px; height:40px; border-radius:999px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22); color:#fff; font-size:19px; display:grid; place-items:center; cursor:pointer;}
  .ob-title{margin:0 0 8px; font-size:22px; font-weight:800; text-align:center; letter-spacing:-.01em; color:var(--ink);}
  .ob-text{margin:0; font-size:14.5px; color:var(--ink2); line-height:1.6; text-align:center;}
  .ob-chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px;}
  .ob-dots{display:flex; gap:8px; justify-content:center; margin:22px 0 0; padding:0;}
  .ob-dots button{width:8px; height:8px; min-height:8px; border-radius:999px; border:0; padding:0; background:var(--line); cursor:pointer;}
  .ob-dots button.on{width:26px; background:#0d9488;}
  .link{background:none; border:0; color:#0f766e; font-weight:700; font-size:13.5px; padding:6px 2px; min-height:38px;}
  [data-theme="dark"] .link{color:#2dd4bf;}
  .google-btn{width:100%; background:var(--card); border:1.5px solid var(--line); color:var(--ink); border-radius:14px; font-weight:700; font-size:14.5px; min-height:48px;}
  .divider{display:flex; align-items:center; gap:10px; color:var(--ink2); font-size:12px; margin:15px 0; font-weight:600;}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line);}

  .receipt{background:#fff; color:#1c2434; border-radius:10px; padding:18px 16px; font-family:"Courier New",monospace; font-size:13px; box-shadow:var(--shadow); margin-top:14px;}
  [data-theme="dark"] .receipt{background:#f7f8fa;}
  .receipt h4{margin:0; text-align:center; font-size:16px;}
  .receipt .c{text-align:center;}
  .receipt hr{border:0; border-top:1px dashed #9aa5b5; margin:9px 0;}
  .receipt table{font-size:12.5px;} .receipt td,.receipt th{border:0; padding:3px 2px; color:#1c2434;}

  .plan{border:1.5px solid var(--line); border-radius:20px; padding:16px; margin-top:12px; background:var(--card);}
  .plan.cur{border-color:#0d9488; background:var(--emerald-soft);}
  .plan .pname{font-size:16px; font-weight:800;}
  .plan .pprice{font-size:30px; font-weight:800; color:var(--ink); letter-spacing:-.02em; margin-top:2px;}
  .plan hr{border:0; border-top:1px solid var(--line); margin:14px 0 0;}
  .plan details{margin-top:12px;}
  .plan summary{font-size:14px; font-weight:800; cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; color:var(--ink);}
  .plan summary::-webkit-details-marker{display:none;}
  .plan summary::after{content:'▾'; color:var(--muted); font-size:12px;}
  .plan details[open ] summary::after{content:'▴';}
  .plan ul{margin:9px 0 0; padding-left:18px; font-size:13px; color:var(--ink2); line-height:1.7;}

  .toast{
    position:absolute; left:50%; transform:translateX(-50%); bottom:108px; z-index:60;
    background:#0c2b28; color:#fff; padding:12px 17px; border-radius:14px; font-size:13.5px; font-weight:700;
    box-shadow:0 14px 30px rgba(0,0,0,.3); max-width:88%; text-align:center; display:none;
  }
  .toast.show{display:block;}
  .modal-wrap{position:absolute; inset:0; background:rgba(4,18,15,.6); z-index:50; display:none; align-items:flex-end; justify-content:center;}
  .modal-wrap.show{display:flex;}
  .modal{background:var(--card); width:100%; max-height:88%; overflow-y:auto; border-radius:26px 26px 0 0; padding:22px 18px calc(26px + env(safe-area-inset-bottom));}
  .modal h3{margin:0 0 6px; font-size:17px; font-weight:800;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div id="app" style="display:flex;flex-direction:column;flex:1;min-height:0;"></div>
  <div class="toast" id="toast"></div>
  <div class="modal-wrap" id="modalWrap"><div class="modal" id="modalBox"></div></div>
<div id="print-area"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut, setPersistence, browserLocalPersistence, GoogleAuthProvider, signInWithPopup, EmailAuthProvider, reauthenticateWithCredential, updatePassword } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';

/* ================= FIREBASE (ShopFlow backend) ================= */
const firebaseConfig = {"apiKey": "AIzaSyDcl40Rd9qltVxIrU-XTitXSckmAKLnO0M", "authDomain": "graphic-mode-k5p7n.firebaseapp.com", "projectId": "graphic-mode-k5p7n", "storageBucket": "graphic-mode-k5p7n.firebasestorage.app", "messagingSenderId": "657836619427", "appId": "1:657836619427:web:c091f3679f4289b50b7116"};
const DB_ID = 'ai-studio-bb8df13d-db00-43a0-af94-c99f11120dd2';
const SUPER_ADMIN_EMAILS = ['aslamsamejo9192@gmail.com', 'samejoas211@gmail.com'];

const auth = getAuth(fbApp);

/* ================= STATE (live Firestore data — no seeded data) ================= */
var DAY = 86400000;
function dstr(offset){ var d=new Date(Date.now()-offset*DAY); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function tstr(ts){ return new Date(ts).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit',hour12:true}); }
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function tsMs(v){ if(!v) return 0; if(typeof v==='number') return v; if(v.toMillis) return v.toMillis(); if(typeof v==='string'){ var t=Date.parse(v); return isNaN(t)?0:t; } if(v instanceof Date) return v.getTime(); return 0; }
function offOf(ts){ return Math.max(0, Math.floor((Date.now()-ts)/DAY)); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoNow(){ return new Date().toISOString(); }
function rid(prefix, len){ var c='abcdefghijklmnopqrstuvwxyz0123456789'; var s=''; for(var i=0;i<len;i++) s+=c[Math.floor(Math.random()*c.length)]; return prefix+s; }
function defaultShop(){ return {id:'', name:'', category:'General Store', currency:'PKR', phone:'', address:'', email:'', tax:0, plan:'free', lowStock:5, allowCredit:true, allowNegStock:false, includeTax:true, status:'active', lastSaleNo:1000, lastPurchaseNo:200}; }

/* ---------- Firestore document -> in-page model ---------- */
function payLabel(m, st){ if(m==='credit') return 'Credit'; if(st==='partial') return 'Partial'; return 'Cash'; }
function mapShop(d){ var x=d.data(); return {id:d.id, name:x.name||'', category:x.category||'General Store', currency:x.currency||'PKR', phone:x.phone||'', address:x.address||'', email:x.email||'', tax:num(x.taxRate), plan:x.subscriptionPlan||'free', lowStock:num(x.lowStockThreshold==null?5:x.lowStockThreshold), allowCredit:x.allowCreditSales!==false, allowNegStock:x.allowNegativeStock===true, includeTax:x.includeTaxOnInvoice!==false, status:x.status||'active', lastSaleNo:num(x.lastSaleNo||1000), lastPurchaseNo:num(x.lastPurchaseNo||200)}; }
function mapCategory(d){ var x=d.data(); return {id:d.id, name:x.name||'', description:x.description||''}; }
function mapProduct(d){ var x=d.data(); return {id:d.id, name:x.name||'', sku:x.sku||'', barcode:x.barcode||'', cat:x.categoryName||'', catId:x.categoryId||'', brand:x.brand||'', unit:x.unit||'piece', buy:num(x.purchasePrice), sell:num(x.salePrice), stock:num(x.quantity), min:num(x.minStockAlert==null?5:x.minStockAlert), expiry:x.expiryDate||'', status:x.status||'Active', supplierId:x.supplierId||''}; }
function mapCustomer(d){ var x=d.data(); return {id:d.id, name:x.name||'', phone:x.phone||'', email:x.email||'', address:x.address||'', due:num(x.balance), creditLimit:num(x.creditLimit==null?500:x.creditLimit)}; }
function mapSupplier(d){ var x=d.data(); return {id:d.id, name:x.name||'', company:x.company||'', phone:x.phone||'', email:x.email||'', address:x.address||'', payable:num(x.balance)}; }
function mapSale(d){ var x=d.data(); var ts=tsMs(x.createdAt); var items=(x.items||[]).map(function(it){ return {name:it.productName||'', qty:num(it.quantity), price:num(it.unitPrice), cost:num(it.cost), disc:num(it.disc)}; }); return {id:d.id, inv:x.invoiceNumber||d.id, ts:ts, off:offOf(ts), items:items, subtotal:num(x.subtotal), total:num(x.total), cost:num(x.cost), cust:x.customerName||'Walk-in', custId:x.customerId||'', pay:payLabel(x.paymentMethod, x.paymentStatus), payMethod:x.paymentMethod||'cash', payStatus:x.paymentStatus||'paid', disc:num(x.discount), tax:num(x.tax), paid:num(x.paidAmount), change:num(x.changeAmount)}; }
function mapPurchase(d){ var x=d.data(); var ts=tsMs(x.createdAt); var items=(x.items||[]).map(function(it){ return {name:it.productName||'', qty:num(it.quantity), price:num(it.unitPrice)}; }); return {id:d.id, inv:x.invoiceNumber||d.id, ts:ts, off:offOf(ts), supplier:x.supplierName||'', supplierId:x.supplierId||'', items:items, subtotal:num(x.subtotal), total:num(x.total), paid:num(x.paidAmount), payable:num(x.remainingAmount), payStatus:x.paymentStatus||'unpaid'}; }
function mapExpense(d){ var x=d.data(); var ts=tsMs(x.createdAt); return {id:d.id, ts:ts, off:offOf(ts), cat:x.category||'General', amount:num(x.amount), method:x.method||'Cash', desc:x.description||'', date:x.date||'', recordedBy:x.recordedBy||''}; }
function mapMovement(d){ var x=d.data(); var ts=tsMs(x.createdAt); return {id:d.id, ts:ts, prod:x.productName||'', prodId:x.productId||'', type:x.type||'adjustment', prev:num(x.previousStock), now:num(x.newStock), chg:num(x.quantityChange), reason:x.reason||'', user:x.performedBy||''}; }
function roleLabel(r){ if(r==='owner') return 'Owner'; if(r==='manager') return 'Manager'; if(r==='cashier') return 'Cashier'; return 'Inventory Staff'; }
function roleId(lbl){ if(lbl==='Owner') return 'owner'; if(lbl==='Manager') return 'manager'; if(lbl==='Cashier') return 'cashier'; return 'inventory'; }
function mapEmployee(d){ var x=d.data(); return {id:d.id, name:x.name||'', email:x.email||'', phone:x.phone||'', role:roleLabel(x.role||'cashier'), roleId:x.role||'cashier', active:x.status!=='disabled'}; }
function mapPayment(d){ var x=d.data(); return {id:d.id, ownerId:x.ownerId||'', ownerEmail:x.ownerEmail||'', planId:x.planId||'', planName:x.planName||'', amount:num(x.amount), method:x.paymentMethod||'', ref:x.transactionRef||'', notes:x.notes||'', status:x.status||'pending', adminRemarks:x.adminRemarks||'', verifiedBy:x.verifiedBy||'', verifiedAt:x.verifiedAt||'', createdAt:x.createdAt||'', screenshot:x.screenshot||'', ts:tsMs(x.createdAt)}; }
function mapSubscription(d){ var x=d.data(); return {id:d.id, ownerId:x.ownerId||'', planId:x.planId||'', planName:x.planName||'', status:x.status||'', amount:num(x.amount), expiresAt:x.expiresAt||'', createdAt:x.createdAt||''}; }
function planName(id){ if(id==='pro') return 'Pro'; if(id==='business') return 'Business'; if(id==='starter') return 'Starter'; if(id==='basic') return 'Basic'; if(id==='premium') return 'Premium'; return 'Free'; }
function updateEffectivePlan(){ if(S.subscription && S.subscription.status==='active' && tsMs(S.subscription.expiresAt)>Date.now()) S.plan=S.subscription.planId||'free'; else S.plan=(S.shop&&S.shop.plan)||'free'; }
function sortDesc(a,b){ return b.ts-a.ts; }

/* ---------- live listeners ---------- */
var unsubs=[];
function stopListeners(){ unsubs.forEach(function(u){ try{u();}catch(e){} }); unsubs=[]; }
function onSnap(q, fn){ unsubs.push(onSnapshot(q, function(snap){ fn(snap); }, function(err){ console.error('listener error', err); })); }
function shopCol(name){ return collection(db, 'shops', S.shopId, name); }
function attachShopListeners(){
  stopListeners();
  if(!S.shopId) return;
  onSnap(doc(db, 'shops', S.shopId), function(snap){
    if(!snap.exists()){ S.shopId=''; S.shop=defaultShop(); updateUserShopId('').catch(function(){}); S.loading=false; go('setup'); return; }
    S.shop=mapShop(snap); updateEffectivePlan();
    if(S.loading){ S.loading=false; S.screen='dashboard'; }
    refresh();
  });
  onSnap(query(shopCol('categories')), function(snap){ S.categories=snap.docs.map(mapCategory).sort(function(a,b){ return a.name.localeCompare(b.name); }); refresh(); });
  onSnap(query(shopCol('products')), function(snap){ S.products=snap.docs.map(mapProduct).sort(function(a,b){ return a.name.localeCompare(b.name); }); refresh(); });
  onSnap(query(shopCol('customers')), function(snap){ S.customers=snap.docs.map(mapCustomer).sort(function(a,b){ return a.name.localeCompare(b.name); }); refresh(); });
  onSnap(query(shopCol('suppliers')), function(snap){ S.suppliers=snap.docs.map(mapSupplier).sort(function(a,b){ return a.name.localeCompare(b.name); }); refresh(); });
  onSnap(query(shopCol('sales')), function(snap){ S.sales=snap.docs.map(mapSale).sort(sortDesc); refresh(); });
  onSnap(query(shopCol('purchases')), function(snap){ S.purchases=snap.docs.map(mapPurchase).sort(sortDesc); refresh(); });
  onSnap(query(shopCol('expenses')), function(snap){ S.expenses=snap.docs.map(mapExpense).sort(sortDesc); refresh(); });
  onSnap(query(shopCol('inventory_transactions')), function(snap){ S.movements=snap.docs.map(mapMovement).sort(sortDesc); refresh(); });
  onSnap(query(shopCol('employees')), function(snap){ S.employees=snap.docs.map(mapEmployee).sort(function(a,b){ return a.name.localeCompare(b.name); }); refresh(); });
  onSnap(query(shopCol('customerPayments')), function(snap){ S.custPayments=snap.docs.map(function(d){ var x=d.data(); return {id:d.id, custId:x.customerId||'', ts:tsMs(x.createdAt), desc:x.desc||'Payment collected', amt:num(x.amount)}; }).sort(sortDesc); refresh(); });
  onSnap(doc(db, 'subscriptions', 'sub_'+S.user.uid), function(snap){ S.subscription=snap.exists()?mapSubscription(snap):null; updateEffectivePlan(); refresh(); });
  onSnap(query(collection(db, 'paymentRecords'), where('ownerId','==',S.user.uid)), function(snap){ S.myPayments=snap.docs.map(mapPayment).sort(sortDesc); refresh(); });
  if(S.isSuperAdmin){
    onSnap(query(collection(db, 'paymentRecords')), function(snap){ S.adminPayments=snap.docs.map(mapPayment).sort(sortDesc); refresh(); });
    onSnap(query(collection(db, 'shops')), function(snap){ S.adminShops=snap.docs.map(function(d){ var x=d.data(); return {id:d.id, name:x.name||'', ownerId:x.ownerId||'', plan:x.subscriptionPlan||'free', status:x.status||'active'}; }); refresh(); });
    onSnap(query(collection(db, 'users')), function(snap){ S.adminUsers=snap.docs.map(function(d){ return {id:d.id}; }); refresh(); });
    onSnap(query(collection(db, 'subscriptions')), function(snap){ S.adminSubs=snap.docs.map(mapSubscription); refresh(); });
  }
}
function hasPendingPayment(){ return S.myPayments.some(function(p){ return p.status==='pending'; }); }
function customerLedger(custId){
  var out=[];
  S.sales.forEach(function(s){ if(s.custId===custId && (s.total-s.paid)>0) out.push({ts:s.ts, desc:'Sale #'+s.inv+' ('+s.pay+')', amt:s.total-s.paid, type:'due'}); });
  (S.custPayments||[]).forEach(function(p){ if(p.custId===custId) out.push({ts:p.ts, desc:p.desc, amt:p.amt, type:'pay'}); });
  out.sort(function(a,b){ return b.ts-a.ts; });
  return out;
}

/* ================= HELPERS ================= */
function $(id){ return document.getElementById(id); }
function fmt(n){ return 'Rs ' + Math.round(n).toLocaleString('en-PK'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function prod(id){ for(var i=0;i<S.products.length;i++) if(S.products[i].id===id) return S.products[i]; return null; }
function custById(id){ for(var i=0;i<S.customers.length;i++) if(S.customers[i].id===id) return S.customers[i]; return null; }
function supById(id){ for(var i=0;i<S.suppliers.length;i++) if(S.suppliers[i].id===id) return S.suppliers[i]; return null; }
function catByName(n){ for(var i=0;i<S.categories.length;i++) if(S.categories[i].name===n) return S.categories[i]; return null; }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); },2400); }

/* ---------- click feedback ---------- */
function press(btn,label){ if(!btn) return null; try{ if(btn.dataset.orig==null) btn.dataset.orig=btn.innerHTML; }catch(e){} btn.classList.add('busy'); btn.disabled=true; btn.innerHTML='⏳ '+(label||'Saving…'); return btn; }
function unpress(btn){ if(!btn) return; btn.classList.remove('busy'); btn.disabled=false; try{ if(btn.dataset.orig!=null){ btn.innerHTML=btn.dataset.orig; delete btn.dataset.orig; } }catch(e){} }

/* ---------- PDF (jsPDF via CDN) ---------- */
function jspdfLib(){ return (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : null; }
function newPDF(){ var J=jspdfLib(); if(!J){ toast('PDF library could not load — check connection and try again'); return null; } return new J({unit:'pt', format:'a4'}); }
function receiptRows(s){ return s.items.map(function(it){ return {name:it.name, qty:it.qty, amt:it.price*it.qty*(1-(it.disc||0)/100)}; }); }
function downloadReceiptPDF(btn){
  var s=S.lastSale; if(!s){ toast('No receipt to download yet'); return; }
  press(btn,'Preparing…');
  var doc=newPDF(); if(!doc){ unpress(btn); return; }
  var y=48;
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text(S.shop.name||'ShopFlow', 297.6, y, {align:'center'}); y+=20;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  if(S.shop.address){ doc.text(S.shop.address, 297.6, y, {align:'center'}); y+=14; }
  if(S.shop.phone){ doc.text('Phone: '+S.shop.phone, 297.6, y, {align:'center'}); y+=14; }
  y+=4; doc.line(40,y,555.3,y); y+=18;
  doc.setFontSize(11);
  doc.text('Invoice #'+s.inv, 40, y); doc.text(tstr(s.ts), 555.3, y, {align:'right'}); y+=16;
  doc.text('Customer: '+(s.cust||'Walk-in'), 40, y); doc.text('Payment: '+(s.pay||''), 555.3, y, {align:'right'}); y+=16;
  y+=2; doc.line(40,y,555.3,y); y+=18;
  doc.setFont('helvetica','bold');
  doc.text('Item', 40, y); doc.text('Qty', 400, y, {align:'right'}); doc.text('Amount', 555.3, y, {align:'right'}); y+=16;
  doc.setFont('helvetica','normal');
  receiptRows(s).forEach(function(r){
    if(y>740){ doc.addPage(); y=48; }
    doc.text(r.name, 40, y); doc.text(String(r.qty), 400, y, {align:'right'}); doc.text(fmt(r.amt), 555.3, y, {align:'right'}); y+=15;
  });
  y+=4; doc.line(40,y,555.3,y); y+=18;
  var sub=(s.subtotal!=null)?s.subtotal:receiptRows(s).reduce(function(a,r){ return a+r.amt; },0);
  doc.text('Subtotal', 40, y); doc.text(fmt(sub), 555.3, y, {align:'right'}); y+=16;
  if(s.disc){ doc.text('Discount', 40, y); doc.text('- '+fmt(s.disc), 555.3, y, {align:'right'}); y+=16; }
  doc.text('Tax', 40, y); doc.text(fmt(s.tax||0), 555.3, y, {align:'right'}); y+=16;
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('Grand Total', 40, y); doc.text(fmt(s.total), 555.3, y, {align:'right'}); y+=18;
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text('Paid', 40, y); doc.text(fmt(s.paid), 555.3, y, {align:'right'}); y+=16;
  doc.text('Due', 40, y); doc.text(fmt(s.total-s.paid), 555.3, y, {align:'right'}); y+=22;
  doc.text('Thank you for shopping with us!', 297.6, y, {align:'center'});
  doc.save('Invoice-'+String(s.inv).replace(/[^A-Za-z0-9\-]/g,'')+'.pdf');
  unpress(btn);
  toast('Invoice PDF downloaded');
}
function downloadReportPDF(btn){
  var f=S.reportFilter; var maxOff = f==='7'?6 : f==='30'?29 : 0;
  var label = f==='7'?'Last 7 days' : f==='30'?'Last 30 days' : 'Today';
  press(btn,'Preparing…');
  var list=salesIn(0,maxOff);
  var sales=sumSales(list), profit=sumProfit(list);
  var exp=S.expenses.filter(function(e){ return Math.floor((Date.now()-e.ts)/DAY)<=maxOff; }).reduce(function(a,e){return a+e.amount;},0);
  var doc=newPDF(); if(!doc){ unpress(btn); return; }
  var y=48;
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text((S.shop.name||'ShopFlow')+' - Sales Report', 40, y); y+=20;
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text('Period: '+label+'  ·  Generated: '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}), 40, y); y+=20;
  doc.line(40,y,555.3,y); y+=20;
  var rows=[['Total Sales',sales],['Gross Profit',profit],['Expenses',exp],['Net Profit',profit-exp],['Customer Dues',custDues()],['Supplier Payables',supPayables()]];
  rows.forEach(function(r){ doc.text(r[0],40,y); doc.text(fmt(r[1]),555.3,y,{align:'right'}); y+=17; });
  y+=6; doc.line(40,y,555.3,y); y+=20;
  doc.setFont('helvetica','bold'); doc.text('Best sellers',40,y); y+=18;
  doc.setFont('helvetica','normal');
  var agg={}; S.sales.forEach(function(s){ s.items.forEach(function(it){ agg[it.name]=(agg[it.name]||0)+it.qty; }); });
  var best=Object.keys(agg).sort(function(a,b){return agg[b]-agg[a];}).slice(0,5);
  if(!best.length){ doc.text('No sales yet',40,y); y+=16; }
  best.forEach(function(n){ if(y>740){ doc.addPage(); y=48; } doc.text(n,40,y); doc.text(agg[n]+' sold',555.3,y,{align:'right'}); y+=16; });
  y+=6; doc.line(40,y,555.3,y); y+=20;
  doc.setFont('helvetica','bold'); doc.text('Low stock',40,y); y+=18;
  doc.setFont('helvetica','normal');
  var low=lowStock().concat(outStock());
  if(!low.length){ doc.text('All stock levels are healthy',40,y); y+=16; }
  low.forEach(function(p){ if(y>740){ doc.addPage(); y=48; } doc.text(p.name+' - '+p.stock+' left',40,y); y+=16; });
  doc.save('ShopFlow-Report-'+label.replace(/\s+/g,'-')+'.pdf');
  unpress(btn);
  toast('Report PDF downloaded');
}

/* ---------- print (receipt / statement) ---------- */
function printHTML(html){ var pa=$('print-area'); if(!pa){ toast('Print is not available'); return; } pa.innerHTML=html; setTimeout(function(){ window.print(); },60); }
function receiptPrintHTML(s){
  var rows=s.items.map(function(it){ return '<tr><td>'+esc(it.name)+'</td><td class="num">'+it.qty+'</td><td class="num">'+fmt(it.price*it.qty*(1-(it.disc||0)/100))+'</td></tr>'; }).join('');
  return '<h4>'+esc(S.shop.name)+'</h4><div class="c small">'+esc(S.shop.address)+'<br>'+esc(S.shop.phone)+'</div><hr>'
    +'<div>Invoice #'+esc(s.inv)+' &nbsp; '+tstr(s.ts)+'<br>Customer: '+esc(s.cust)+' &nbsp;·&nbsp; '+(s.pay||'')+'</div><hr>'
    +'<table><tr><th>Item</th><th class="num">Qty</th><th class="num">Amount</th></tr>'+rows+'</table><hr>'
    +(s.disc?'<div>Discount: - '+fmt(s.disc)+'</div>':'')
    +'<div>Tax: '+fmt(s.tax||0)+'</div><div><b>Grand Total: '+fmt(s.total)+'</b></div>'
    +'<div>Paid: '+fmt(s.paid)+' &nbsp; Due: '+fmt(s.total-s.paid)+'</div><hr><div class="c">Thank you for shopping with us!</div>';
}
function printReceipt(){ if(!S.lastSale){ toast('No receipt to print yet'); return; } printHTML(receiptPrintHTML(S.lastSale)); }
function printSaleReceipt(id){ var s=null; S.sales.forEach(function(x){ if(x.id===id) s=x; }); if(!s){ toast('Receipt not found'); return; } printHTML(receiptPrintHTML(s)); }
function printCustomerReceipt(custId){
  var list=S.sales.filter(function(x){ return x.custId===custId; });
  if(!list.length){ toast('No receipt to print yet'); return; }
  printHTML(receiptPrintHTML(list[0]));
}
function printCustomerStatement(custId){
  var c=custById(custId); if(!c){ toast('Customer not found'); return; }
  var led=customerLedger(custId);
  var rows=led.map(function(l){ return '<tr><td>'+esc(l.desc)+'<br><span class="small">'+tstr(l.ts)+'</span></td><td class="num">'+(l.type==='due'?'+':'-')+' '+fmt(l.amt)+'</td></tr>'; }).join('');
  var html='<h4>'+esc(S.shop.name)+'</h4><div class="c small">'+esc(S.shop.address)+'<br>'+esc(S.shop.phone)+'</div><hr>'
    +'<div>Customer Statement<br>'+esc(c.name)+' &nbsp;·&nbsp; '+esc(c.phone||'')+'<br>'+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+'</div><hr>'
    +'<table><tr><th>Entry</th><th class="num">Amount</th></tr>'+(rows||'<tr><td colspan="2">No ledger entries yet.</td></tr>')+'</table><hr>'
    +'<div><b>Outstanding Due: '+fmt(c.due)+'</b></div><hr><div class="c">Thank you!</div>';
  printHTML(html);
}

/* ---------- Google sign-in ---------- */
function googleLogin(btn){
  press(btn,'Signing in…');
  var provider=new GoogleAuthProvider();
  signInWithPopup(auth, provider).then(function(cred){
    return getOrCreateProfile(cred.user, cred.user.displayName||'');
  }).then(function(){ /* onAuthStateChanged routes to shop setup / dashboard */ }).catch(function(e){
    unpress(btn);
    var c=(e&&e.code)||'';
    if(c.indexOf('unauthorized-domain')>=0) toast('Google sign-in needs the site domain added in Firebase console — ask the owner');
    else if(c.indexOf('popup-closed-by-user')>=0) toast('Google sign-in cancelled');
    else if(c.indexOf('popup-blocked')>=0) toast('Popup blocked — allow popups for this site');
    else toast(authErrorMessage(e));
  });
}

/* ---------- payment screenshot ---------- */
function openScreenshotPicker(){ var inp=$('pm_shot'); if(inp) inp.click(); }
function attachScreenshot(input){
  var f=input && input.files && input.files[0];
  if(!f) return;
  if(f.size>10*1024*1024){ toast('Image is too large (max 10 MB)'); input.value=''; return; }
  if(f.type.indexOf('image/')!==0){ toast('Please choose an image file'); input.value=''; return; }
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var maxW=800, w=img.width, h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }

    +days.map(function(d){ return '<div class="bar-col"><span class="v">'+(d.v?Math.round(d.v/100)/10+'k':'')+'</span><div class="bar'+(d.off===0?' today':'')+'" style="height:'+Math.max(4,Math.round(d.v/max*74))+'px"></div><span class="d">'+dstr(d.off)+'</span></div>'; }).join('')
    +'</div></div>';
  /* best sellers */
  var agg={};
  S.sales.forEach(function(s){ s.items.forEach(function(it){ agg[it.name]=(agg[it.name]||0)+it.qty; }); });
  var best=Object.keys(agg).sort(function(a,b){return agg[b]-agg[a];}).slice(0,3);
  inner+='<div class="card"><h3>🏆 Best-selling products</h3>'
    +(best.length?best.map(function(n,i){ return '<div class="list-item"><div class="thumb">'+['🥇','🥈','🥉'][i]+'</div><div class="grow bold">'+esc(n)+'</div><span class="badge b-indigo">'+agg[n]+' sold</span></div>'; }).join(''):'<div class="empty">No sales yet</div>')
    +'</div>';
  /* recent */
  var rec=S.sales.slice(0,4);
  inner+='<div class="card"><h3>🕘 Recent transactions</h3>'
    +(rec.length?rec.map(function(s){ return '<div class="list-item"><div class="thumb green">🧾</div><div class="grow"><div class="bold">Sale #'+s.inv+' · '+esc(s.cust)+'</div><div class="muted">'+tstr(s.ts)+' · '+s.pay+'</div></div><div class="price">'+fmt(s.total)+'</div></div>'; }).join(''):'<div class="empty">No sales yet — start from POS</div>')
    +'</div>';
  return shell(h+pad(inner),'dashboard');
}

function cartTotals(){
  var sub=0,cost=0;
  S.cart.forEach(function(ci){ var p=prod(ci.id); if(!p)return; sub+=p.sell*ci.qty*(1-(ci.disc||0)/100); cost+=p.buy*ci.qty; });
  var afterDisc=sub*(1-(S.invDisc||0)/100);
  var tax=S.shop.includeTax?afterDisc*(S.shop.tax/100):0;
  return {sub:sub, discAmt:sub-afterDisc, tax:tax, grand:afterDisc+tax, cost:cost};
}

function addToCart(id){ var p=prod(id); var ex=null;
  S.cart.forEach(function(ci){ if(ci.id===id) ex=ci; });
  if(ex){ if(!S.shop.allowNegStock && ex.qty>=p.stock){ toast('Only '+p.stock+' in stock'); return; } ex.qty++; }
  else S.cart.push({id:id,qty:1,disc:0});
  render();
}
function chgQty(i,d){ var ci=S.cart[i]; var p=prod(ci.id); ci.qty+=d;
  if(ci.qty<=0) S.cart.splice(i,1);
  else if(p && !S.shop.allowNegStock && ci.qty>p.stock){ ci.qty=p.stock; toast('Only '+p.stock+' in stock'); }
  render();
}
function removeCart(i){ S.cart.splice(i,1); render(); }
function setItemDisc(i,v){ S.cart[i].disc=Math.min(100,Math.max(0,parseFloat(v)||0)); render(); }
function completeSale(btn){
  if(!S.cart.length){ toast('Cart is empty'); return; }
  if(!S.shop.allowCredit && (S.payType==='Partial'||S.payType==='Credit')){ toast('Credit sales are turned off in Settings'); return; }
  for(var ci0=0; ci0<S.cart.length; ci0++){ var pp0=prod(S.cart[ci0].id); if(pp0 && !S.shop.allowNegStock && S.cart[ci0].qty>pp0.stock){ toast('Only '+pp0.stock+' in stock for '+pp0.name); return; } }
  var t=cartTotals();
  var cust=(S.posCustomer==='walkin')?null:custById(S.posCustomer);
  if((S.payType==='Partial'||S.payType==='Credit') && !cust){ toast('Select a named customer for partial / credit sales'); return; }
  var paid=t.grand;
  if(S.payType==='Partial'){ paid=num(($('paidAmt')||{}).value); if(paid<=0||paid>=t.grand){ toast('Enter a partial amount between 1 and the total'); return; } }
  if(S.payType==='Credit') paid=0;
  var cashReceived=0;
  if(S.payType==='Cash'){ cashReceived=num(($('cashAmt')||{}).value); }
  var payMethod=(S.payType==='Credit')?'credit':'cash';
  var payStatus=(S.payType==='Cash')?'paid':(S.payType==='Partial'?'partial':'unpaid');
  var due=t.grand-paid;
  press(btn,'Processing…');
  var saleId=rid('sale_',10);
  var inv='';
  var items=S.cart.map(function(ci){ var p=prod(ci.id); return {productId:p.id, productName:p.name, quantity:ci.qty, unitPrice:p.sell, totalPrice:p.sell*ci.qty*(1-(ci.disc||0)/100), cost:p.buy*ci.qty, disc:ci.disc||0}; });
  runTransaction(db, function(tx){
    var shopRef=doc(db,'shops',S.shopId);
    return tx.get(shopRef).then(function(shopSnap){
      var lastNo=1000;
      if(shopSnap.exists() && shopSnap.data().lastSaleNo!=null) lastNo=num(shopSnap.data().lastSaleNo);
      var nextNo=lastNo+1;
      inv='INV-'+String(nextNo).padStart(4,'0');
      var prodRefs=S.cart.map(function(ci){ return doc(db,'shops',S.shopId,'products',ci.id); });
      var gets=prodRefs.map(function(r){ return tx.get(r); });
      return Promise.all(gets).then(function(snaps){
        var salePayload={shopId:S.shopId, invoiceNumber:inv, cashierId:S.user.uid, cashierName:S.user.name||'', customerId:cust?cust.id:'', customerName:cust?cust.name:'Walk-in', customerPhone:cust?cust.phone:'', items:items.map(function(it){ return {productId:it.productId, productName:it.productName, quantity:it.quantity, unitPrice:it.unitPrice, totalPrice:it.totalPrice, cost:it.cost, disc:it.disc}; }), subtotal:t.sub, discount:t.discAmt, tax:t.tax, total:t.grand, paidAmount:paid, changeAmount:Math.max(0,cashReceived-t.grand), paymentMethod:payMethod, paymentStatus:payStatus, notes:'', cost:t.cost, createdAt:serverTimestamp()};
        tx.set(doc(db,'shops',S.shopId,'sales',saleId), salePayload);
        tx.update(shopRef, {lastSaleNo:nextNo, updatedAt:serverTimestamp()});
        S.cart.forEach(function(ci, idx){
          var snap=snaps[idx];
          var curQty=snap.exists()?num(snap.data().quantity):0;
          var newQty=curQty-ci.qty;
          if(!S.shop.allowNegStock && newQty<0){ throw new Error('Only '+curQty+' in stock for '+(snap.exists()?snap.data().name:'this product')); }
          if(newQty<0) newQty=0;
          tx.update(prodRefs[idx], {quantity:newQty, updatedAt:serverTimestamp()});
          tx.set(doc(db,'shops',S.shopId,'inventory_transactions',rid('tx_',10)), {shopId:S.shopId, productId:ci.id, productName:prod(ci.id)?prod(ci.id).name:'', type:'sale', quantityChange:-ci.qty, previousStock:curQty, newStock:newQty, reason:'Sale #'+inv, performedBy:S.user.name||'Owner', createdAt:serverTimestamp()});
        });
        if(due>0 && cust){ tx.update(doc(db,'shops',S.shopId,'customers',cust.id), {balance:increment(due)}); }
      });
    });
  }).then(function(){
    var sale={id:saleId, inv:inv, ts:Date.now(), off:0, items:items.map(function(it){ return {name:it.productName, qty:it.quantity, price:it.unitPrice, cost:it.cost, disc:it.disc}; }), total:t.grand, cost:t.cost, cust:cust?cust.name:'Walk-in', pay:S.payType, disc:t.discAmt, tax:t.tax, paid:paid};
    S.cart=[]; S.invDisc=0; S.paidAmt=''; S.lastSale=sale; go('receipt');
  }).catch(function(e){ unpress(btn); toast(e&&e.message?e.message:'Sale failed — try again'); });
}

function saveProduct(btn){
  var name=$('pf_name').value.trim(); if(!name){ toast('Product name is required'); return; }
  var sku=$('pf_sku').value.trim()||('SKU-'+rid('',6).toUpperCase());
  var dup=S.products.some(function(p){ return p.id!==S.editProdId && sku && p.sku===sku; });
  if(dup){ toast('This SKU already exists in your shop'); return; }
  var catName=$('pf_cat').value||'';
  var cat=catByName(catName);
  var data={name:name, sku:sku, barcode:$('pf_bar').value.trim(), categoryId:cat?cat.id:'', categoryName:catName, unit:$('pf_unit').value, brand:$('pf_brand').value.trim(), purchasePrice:num($('pf_buy').value), salePrice:num($('pf_sell').value), minStockAlert:num($('pf_min').value), expiryDate:$('pf_exp').value||'', status:$('pf_status').value};
  if(data.salePrice<0){ toast('Selling price cannot be negative'); return; }
  var newStock=num($('pf_stock').value);
  if(newStock<0){ toast('Stock cannot be negative'); return; }
  press(btn,'Saving…');
  if(S.editProdId){
    var p=prod(S.editProdId);
    var oldStock=p?p.stock:0;
    var payload={shopId:S.shopId, name:data.name, barcode:data.barcode, sku:data.sku, categoryId:data.categoryId, categoryName:data.categoryName, supplierId:p?p.supplierId:'', purchasePrice:data.purchasePrice, salePrice:data.salePrice, quantity:newStock, minStockAlert:data.minStockAlert, unit:data.unit, expiryDate:data.expiryDate, imageUrl:'', status:data.status, updatedAt:serverTimestamp()};
    updateDoc(doc(db,'shops',S.shopId,'products',S.editProdId), payload).then(function(){
      if(newStock!==oldStock){
        var delta=newStock-oldStock;
        return setDoc(doc(db,'shops',S.shopId,'inventory_transactions',rid('tx_',10)), {shopId:S.shopId, productId:S.editProdId, productName:data.name, type:delta>=0?'in':'out', quantityChange:delta, previousStock:oldStock, newStock:newStock, reason:'Manual edit', performedBy:S.user.name||'Owner', createdAt:serverTimestamp()});
      }
    }).then(function(){ toast('Product updated'); go('products'); }).catch(function(e){ unpress(btn); toast(authErrorMessage(e)); });
  } else {
    var prodId=rid('prod_',8);
    var payload2={shopId:S.shopId, name:data.name, barcode:data.barcode, sku:data.sku, categoryId:data.categoryId, categoryName:data.categoryName, supplierId:'', purchasePrice:data.purchasePrice, salePrice:data.salePrice, quantity:newStock, minStockAlert:data.minStockAlert, unit:data.unit, expiryDate:data.expiryDate, imageUrl:'', status:data.status, createdAt:serverTimestamp(), updatedAt:serverTimestamp()};
    setDoc(doc(db,'shops',S.shopId,'products',prodId), payload2).then(function(){
      if(newStock>0){
        return setDoc(doc(db,'shops',S.shopId,'inventory_transactions',rid('tx_',10)), {shopId:S.shopId, productId:prodId, productName:data.name, type:'in', quantityChange:newStock, previousStock:0, newStock:newStock, reason:'Opening stock', performedBy:S.user.name||'Owner', createdAt:serverTimestamp()});
      }
    }).then(function(){ toast('Product added'); go('products'); }).catch(function(e){ unpress(btn); toast(authErrorMessage(e)); });
  }
}

function adjustStockPrompt(id){
  var p=prod(id);
  openModal('<h3>🔧 Stock Adjustment — '+esc(p.name)+'</h3><p class="muted">Current stock: <b>'+p.stock+'</b></p>'
    +'<label>New stock quantity</label><input id="adj_qty" type="number" value="'+p.stock+'">'
    +'<label>Reason</label><select id="adj_reason"><option>Damaged</option><option>Expired</option><option>Returned</option><option>Stock count correction</option><option>Other</option></select>'
    +'<button class="btn emerald block" style="margin-top:14px;" onclick="saveAdjustment(\''+id+'\',this)\">Save Adjustment</button>'
    +'<button class="btn ghost block" style="margin-top:8px;" onclick="closeModal()">Cancel</button>');
}
function saveAdjustment(id, btn){
  var p=prod(id); if(!p){ closeModal(); return; }
  var nq=num($('adj_qty').value); var reason=$('adj_reason').value;
  if(nq<0){ toast('Stock cannot be negative'); return; }
  press(btn,'Saving…');
  var delta=nq-p.stock;
  updateDoc(doc(db,'shops',S.shopId,'products',id), {quantity:nq, updatedAt:serverTimestamp()}).then(function(){
    return setDoc(doc(db,'shops',S.shopId,'inventory_transactions',rid('tx_',10)), {shopId:S.shopId, productId:id, productName:p.name, type:delta>=0?'in':'out', quantityChange:delta, previousStock:p.stock, newStock:nq, reason:reason, performedBy:S.user.name||'Owner', createdAt:serverTimestamp()});
  }).then(function(){ closeModal(); toast('Stock adjusted'); go('products'); }).catch(function(e){ unpress(btn); toast(authErrorMessage(e)); });
}

function addCat(btn){ var n=$('cat_name').value.trim(); if(!n){ toast('Enter a category name'); return; }
  if(S.categories.some(function(c){return c.name.toLowerCase()===n.toLowerCase();})){ toast('Category already exists'); return; }
  press(btn,'Adding…');
  setDoc(doc(db,'shops',S.shopId,'categories',rid('cat_',8)), {shopId:S.shopId, name:n, description:'', createdAt:serverTimestamp()}).then(function(){ toast('Category added'); render(); }).catch(function(e){ unpress(btn); toast(authErrorMessage(e)); }); }
function renameCat(id){ var c=null; S.categories.forEach(function(x){ if(x.id===id)c=x; });
  openModal('<h3>✏️ Rename category</h3><label>Name</label><input id="rc_name" value="'+esc(c.name)+'"><button class="btn emerald block" style="margin-top:14px;" onclick="saveCat(\''+id+'\',this)\">Save</button><button class="btn ghost block" style="margin-top:8px;" onclick="closeModal()">Cancel</button>'); }
function saveCat(id, btn){ var n=$('rc_name').value.trim(); if(!n) return;
  press(btn,'Saving…');
  var batch=writeBatch(db);
  batch.update(doc(db,'shops',S.shopId,'categories',id), {name:n});
  S.products.forEach(function(p){ if(p.catId===id) batch.update(doc(db,'shops',S.shopId,'products',p.id), {categoryName:n, updatedAt:serverTimestamp()}); });
  batch.commit().then(function(){ closeModal(); toast('Category updated'); render(); }).catch(function(e){ unpress(btn); toast(authErrorMessage(e)); }); }
function deleteCat(id, btn){ var c=null; S.categories.forEach(function(x){ if(x.id===id)c=x; });
  if(!c) return;
  var n=S.products.filter(function(p){return p.catId===id;}).length;
  if(n>0){ toast('Cannot delete — '+n+' products use this category. Move them first.'); return; }
  press(btn,'Deleting…');
  deleteDoc(doc(db,'shops',S.shopId,'categories',id)).then(function(){ toast('Category deleted'); render(); }).catch(function(e){ unpress(btn); toast(authErrorMessage(e)); }); }

    }).join(''):'<div class="empty">No purchases yet.</div>')
    +'</div>';

function newPurchase(){ if(!S.products.length){ toast('Add a product first — purchases need a product'); return; } S.purLines=[{prodId:S.products[0].id, qty:10, price:S.products[0].buy}]; S.purSupplier=S.suppliers.length?S.suppliers[0].id:''; S.purDisc=0; go('purchaseForm'); }
function vPurchaseForm(){
  var h=topbar('New Purchase','Stock will increase when you complete it','purchases');
  var total=S.purLines.reduce(function(a,l){ return a+l.qty*l.price; },0) - (S.purDisc||0);
  var inner='<div class="card"><h3>🚚 Purchase details</h3>'
    +'<label>Supplier</label><select onchange="S.purSupplier=this.value">'+(S.suppliers.length?S.suppliers.map(function(s){ return '<option value="'+s.id+'"'+(S.purSupplier===s.id?' selected':'')+'>'+esc(s.name)+'</option>'; }).join(''):'<option value="">No supplier</option>')+'</select>'
    +'<label>Items</label>'
    +S.purLines.map(function(l,i){
      return '<div class="card" style="margin-top:8px;padding:10px;"><select onchange="setPurProd('+i+',this.value)">'
        +S.products.map(function(p){ return '<option value="'+p.id+'"'+(l.prodId===p.id?' selected':'')+'>'+esc(p.name)+'</option>'; }).join('')+'</select>'
        +'<div class="grid2" style="margin-top:8px;"><div><label>Qty</label><input type="number" value="'+l.qty+'" onchange="S.purLines['+i+'].qty=parseFloat(this.value)||0;render()"></div>'
        +'<div><label>Purchase price (Rs)</label><input type="number" value="'+l.price+'" onchange="S.purLines['+i+'].price=parseFloat(this.value)||0;render()"></div></div>'
        +'<div class="row" style="margin-top:6px;"><span class="muted small">Line total: <b>'+fmt(l.qty*l.price)+'</b></span><button class="link right" style="color:var(--red);" onclick="S.purLines.splice('+i+',1);render()">Remove</button></div></div>';
    }).join('')
    +'<button class="btn ghost block" style="margin-top:10px;" onclick="addPurLine()">+ Add Item</button>'
    +'<div class="grid2"><div><label>Discount (Rs)</label><input type="number" value="'+(S.purDisc||0)+'" onchange="S.purDisc=parseFloat(this.value)||0;render()"></div>'
    +'<div><label>Paid amount (Rs)</label><input type="number" id="pur_paid" placeholder="0"></div></div>'
    +'<div style="margin-top:10px;"><div class="tot-row grand"><span>Total</span><span>'+fmt(total)+'</span></div>'
    +'<p class="muted">Remaining amount becomes payable to '+esc((supById(S.purSupplier)||{name:'the supplier'}).name)+'.</p></div>'
    +'<button class="btn emerald block" onclick="completePurchase('+total+',this)">✅ Complete Purchase</button></div>';
  return shell(h+pad(inner),'');
}
function setPurProd(i,v){ var p=prod(v); S.purLines[i].prodId=v; if(p) S.purLines[i].price=p.buy; render(); }
function addPurLine(){ if(!S.products.length){ toast('Add a product first'); return; } S.purLines.push({prodId:S.products[0].id, qty:1, price:S.products[0].buy}); render(); }
function completePurchase(total, btn){
  if(!S.purLines.length){ toast('Add at least one item'); return; }
  total=Math.max(0,total);
  for(var li=0; li<S.purLines.length; li++){ if(!prod(S.purLines[li].prodId)){ toast('Pick a product for every line'); return; } if(!(S.purLines[li].qty>0)){ toast('Quantities must be above 0'); return; } }
  press(btn,'Processing…');
  var paid=Math.min(total, num(($('pur_paid')||{}).value));
  var sup=supById(S.purSupplier);
  var purId=rid('pur_',10);
  var items=S.purLines.map(function(l){ var p=prod(l.prodId); return {productId:p.id, productName:p.name, quantity:l.qty, unitPrice:l.price, totalPrice:l.qty*l.price}; });
  var subtotal=S.purLines.reduce(function(a,l){ return a+l.qty*l.price; },0);
  var inv='';
  runTransaction(db, function(tx){
    var shopRef=doc(db,'shops',S.shopId);
    return tx.get(shopRef).then(function(shopSnap){
      var lastNo=200;
      if(shopSnap.exists() && shopSnap.data().lastPurchaseNo!=null) lastNo=num(shopSnap.data().lastPurchaseNo);
      var nextNo=lastNo+1;
      inv='PUR-'+String(nextNo).padStart(4,'0');
      var prodRefs=S.purLines.map(function(l){ return doc(db,'shops',S.shopId,'products',l.prodId); });
      var gets=prodRefs.map(function(r){ return tx.get(r); });
      return Promise.all(gets).then(function(snaps){
        var remaining=total-paid;
        var payStatus=remaining<=0?'paid':(paid>0?'partial':'unpaid');
        tx.set(doc(db,'shops',S.shopId,'purchases',purId), {shopId:S.shopId, invoiceNumber:inv, supplierId:sup?sup.id:'', supplierName:sup?sup.name:'', items:items, subtotal:subtotal, discount:num(S.purDisc||0), total:total, paidAmount:paid, remainingAmount:remaining, paymentStatus:payStatus, notes:'', createdBy:S.user.name||'Owner', createdAt:serverTimestamp()});
        tx.update(shopRef, {lastPurchaseNo:nextNo, updatedAt:serverTimestamp()});
        S.purLines.forEach(function(l, idx){
          var snap=snaps[idx];
          var curQty=snap.exists()?num(snap.data().quantity):0;
          var newQty=curQty+l.qty;
          tx.update(prodRefs[idx], {quantity:newQty, purchasePrice:l.price, updatedAt:serverTimestamp()});
          tx.set(doc(db,'shops',S.shopId,'inventory_transactions',rid('tx_',10)), {shopId:S.shopId, productId:l.prodId, productName:prod(l.prodId)?prod(l.prodId).name:'', type:'in', quantityChange:l.qty, previousStock:curQty, newStock:newQty, reason:'Purchase #'+inv, performedBy:S.user.name||'Owner', createdAt:serverTimestamp()});
        });
        if(sup && remaining>0){ tx.update(doc(db,'shops',S.shopId,'suppliers',sup.id), {balance:increment(remaining)}); }
      });
    });
  }).then(function(){ toast('Purchase completed — stock updated'); go('purchases'); }).catch(function(e){ unpress(btn); toast(e&&e.message?e.message:'Purchase failed — try again'); });
}
